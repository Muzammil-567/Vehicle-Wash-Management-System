<div class="profile-view animate-fade-in">
    <h2 style="color: white; margin-bottom: 25px;">My Profie</h2>
    <div class="profile-card"
        style="background: var(--card-bg); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);">
        <div class="profile-header" style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
            <div class="profile-avatar"
                style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--neon-green); overflow: hidden;">
                <img src="https://ui-avatars.com/api/?name=User&background=00FF94&color=000814"
                    style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div>
                <h3 id="profile-name" style="color: white; font-size: 1.5rem;">Loading...</h3>
                <p id="profile-email" style="color: var(--text-dim);">loading@example.com</p>
            </div>
        </div>
        <button class="btn-submit" onclick="localStorage.clear(); window.location.reload();"
            style="background: #ff4757; color: white;">Logout</button>
    </div>
</div>
