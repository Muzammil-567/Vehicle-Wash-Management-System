<header class="customer-header">
    <div class="profile-section">
        <div class="avatar-wrapper">
            <img src="../assets/images/defaults/avatar-placeholder.png" alt="User Profile" onerror="this.src='https://ui-avatars.com/api/?name=User&background=00FF94&color=000814'">
        </div>
        <div class="user-greeting">
            <span>Welcome back,</span>
            <h2 id="customer-name">Hi, Alex!</h2>
        </div>
    </div>
    
    <div class="header-center-workspace desktop-only">
        <div class="desktop-search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search services, vehicles, or help..." id="desktop-search-input">
            <span class="search-shortcut">⌘K</span>
        </div>
    </div>

    <div class="header-actions">
        <!-- Search Trigger (Mobile only) -->
        <div class="header-icon-btn mobile-only" id="btn-global-search">
            <i class="fas fa-search"></i>
        </div>
        
        <div class="header-icon-btn" id="btn-notifications">
            <i class="fas fa-bell"></i>
            <span class="notif-dot"></span>
        </div>

        <div class="header-avatar-btn desktop-only">
            <img src="../assets/images/placeholders/avatar-1.jpg" alt="Profile">
        </div>
    </div>
</header>
