<div class="notification-drawer" id="notif-drawer">
    <div class="notif-drawer-header">
        <h3>Notifications</h3>
        <button class="btn-text" onclick="markAllNotifsRead()">Mark all as read</button>
        <button class="btn-close-drawer" onclick="toggleNotifDrawer()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="notif-list-container">
        <div id="notif-list" class="notif-list">
            <!-- Mock Notifications -->
            <div class="notif-item unread" onclick="markNotifRead(this)">
                <div class="notif-icon-wrap status-success">
                    <i class="fas fa-check"></i>
                </div>
                <div class="notif-body">
                    <p class="notif-msg">Your <b>Honda Civic</b> is now being washed! 🧼</p>
                    <span class="notif-time">2 mins ago</span>
                </div>
                <div class="unread-dot"></div>
            </div>

            <div class="notif-item unread" onclick="markNotifRead(this)">
                <div class="notif-icon-wrap status-info">
                    <i class="fas fa-car"></i>
                </div>
                <div class="notif-body">
                    <p class="notif-msg">Booking confirmed for tomorrow @ 10 AM.</p>
                    <span class="notif-time">1 hour ago</span>
                </div>
                <div class="unread-dot"></div>
            </div>

            <div class="notif-item" onclick="markNotifRead(this)">
                <div class="notif-icon-wrap status-promo">
                    <i class="fas fa-gift"></i>
                </div>
                <div class="notif-body">
                    <p class="notif-msg">Flash Sale! 20% off on Elite Detailing this weekend.</p>
                    <span class="notif-time">5 hours ago</span>
                </div>
            </div>
        </div>

        <!-- Empty State (Hidden) -->
        <div id="notif-empty-state" class="notif-empty-state" style="display: none;">
            <div class="empty-icon-glow">
                <i class="fas fa-bell-slash"></i>
            </div>
            <h4>All caught up!</h4>
            <p>You have no new notifications.</p>
        </div>
    </div>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="toggleNotifDrawer()"></div>
