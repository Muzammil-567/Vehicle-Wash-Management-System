<!-- Active Tracking Card Component -->
<div class="active-tracking-card animate-fade-in-up">

    <!-- Header: Live Status -->
    <div class="tracking-card-header">
        <div class="live-status">
            <span class="live-dot pulse"></span>
            <span class="live-text">LIVE SESSION</span>
        </div>
        <div class="booking-id-pill">#BK-8024</div>
    </div>

    <!-- Vehicle Info -->
    <div class="vehicle-compact-meta">
        <div class="v-icon">
            <i class="fas fa-car-side"></i>
        </div>
        <div class="v-details">
            <h4>Honda Civic</h4>
            <div class="v-sub">
                <span class="plate">ABC-1234</span>
                <span class="separator">•</span>
                <span class="bay">Bay 02</span>
            </div>
        </div>
        <div class="eta-inline">
            <i class="far fa-clock"></i>
            <b>04:30 PM</b>
        </div>
    </div>

    <!-- Progress Tracker: Elegant Timeline -->
    <div class="elegant-timeline">
        <div class="timeline-track">
            <div class="reward-progress-fill" style="width: 33%"></div>
        </div>
        <div class="timeline-points">
            <div class="point active" data-label="Confirmed"><i class="fas fa-check"></i></div>
            <div class="point current" data-label="Received"><i class="fas fa-key"></i></div>
            <div class="point" data-label="Washing"><i class="fas fa-water"></i></div>
            <div class="point" data-label="Ready"><i class="fas fa-star"></i></div>
        </div>
    </div>

    <!-- Footer Actions -->
    <div class="tracking-footer">
        <button class="btn-glass-action btn-sm" id="btn-message">
            <i class="fas fa-comment-dots"></i>
            <span>Message</span>
        </button>
        <button class="btn-glass-action btn-sm btn-details" id="btn-details">
            <i class="fas fa-info-circle"></i>
            <span>Details</span>
        </button>
    </div>

</div>
