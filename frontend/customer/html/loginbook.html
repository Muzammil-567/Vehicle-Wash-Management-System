<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | GlossFlow Book</title>
    <link rel="stylesheet" href="../../shared/css/global.css">
    <link rel="stylesheet" href="../css/loginbook.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-header">
            <a href="../../website/html/index.html" class="logo">GLOSS<span>FLOW</span></a>
            <h1 class="text-glow">Customer Access</h1>
            <p style="color: var(--text-dim);">Join the elite circle of car care.</p>
        </div>

        <div class="auth-toggle">
            <button class="toggle-btn active" id="login-toggle">Login</button>
            <button class="toggle-btn" id="signup-toggle">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" class="form-control" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary btn-auth">Enter Portal</button>
        </form>

        <!-- Signup Form (Hidden by default) -->
        <form id="signup-form" class="auth-form hidden">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signup-email" class="form-control" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="signup-phone" class="form-control" placeholder="+92 300 1234567" required>
            </div>
            <div class="form-group">
                <label>Create Password</label>
                <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary btn-auth">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>New here? Create an account for faster booking!</p>
            <p style="margin-top: 10px;">By joining, you agree to our <a href="#">Terms & Conditions</a></p>
        </div>
    </div>

    <script src="../js/loginbook.js"></script>
</body>
</html>
