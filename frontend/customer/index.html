<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlossFlow | Premium Car Care Dashboard</title>

    <!-- SEO & Icons -->
    <meta name="description" content="Manage your vehicle care with GlossFlow. Premium car wash booking and tracking.">
    <link rel="icon" type="image/png" href="../assets/images/logo/favicon.png">

    <!-- External Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sections/customer/dashboard.css">
</head>

<body class="customer-shell">

    <!-- Universal App Wrapper -->
    <div class="app-container">
        
        <!-- Sidebar (Desktop Only) -->
        <aside class="sidebar-nav-desktop">
            <div class="sidebar-logo">
                <i class="fas fa-soap"></i>
                <span>Gloss<em>Flow</em></span>
            </div>
            <nav class="nav-links">
                <div class="nav-item active" data-tab="home">
                    <i class="fas fa-home"></i> <span>Home</span>
                </div>
                <div class="nav-item" data-tab="garage">
                    <i class="fas fa-car"></i> <span>Garage</span>
                </div>
                <div class="nav-item" data-tab="bookings">
                    <i class="fas fa-calendar-check"></i> <span>Bookings</span>
                </div>
                <div class="nav-item" data-tab="profile">
                    <i class="fas fa-user"></i> <span>Profile</span>
                </div>
            </nav>
        </aside>

        <!-- Main Viewport -->
        <div class="main-viewport">
            
            <!-- Unified Header -->
            <header class="dashboard-header">
                <div class="header-left">
                    <h2 id="page-title">Dashboard</h2>
                </div>
                <div class="header-right">
                    <button class="icon-btn"><i class="fas fa-bell"></i></button>
                    <div class="user-avatar">
                        <img src="https://ui-avatars.com/api/?name=Alex+Bryant&background=00FF94&color=000814" alt="User">
                    </div>
                </div>
            </header>

            <!-- Unified Content Area -->
            <main id="main-content" class="content-area">
                <!-- SPA Content or Booking Wizard loads here -->
            </main>

            <!-- Bottom Navigation (Mobile Only) -->
            <nav class="bottom-nav-mobile">
                <div class="nav-item active" data-tab="home">
                    <i class="fas fa-home"></i> <span>Home</span>
                </div>
                <div class="nav-item" data-tab="garage">
                    <i class="fas fa-car"></i> <span>Garage</span>
                </div>
                <div class="nav-item" data-tab="bookings">
                    <i class="fas fa-calendar-check"></i> <span>Book</span>
                </div>
                <div class="nav-item" data-tab="profile">
                    <i class="fas fa-user"></i> <span>Profile</span>
                </div>
            </nav>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/customer-logic/app.js"></script>
</body>

</html>
