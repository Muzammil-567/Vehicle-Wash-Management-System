<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if(!localStorage.getItem('token')){ window.location.replace('/frontend/auth/login.html'); }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlossFlow | Premium Car Care Dashboard</title>

    <!-- SEO & Icons -->
    <meta name="description" content="Manage your vehicle care with GlossFlow. Premium car wash booking and tracking.">
    <link rel="icon" type="image/png" href="../assets/images/logo/favicon.png">

    <!-- External Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sections/customer/dashboard.css">
</head>

<body class="customer-shell">

    <!-- Universal App Wrapper -->
    <div class="app-container">
        
        <!-- Sidebar (Desktop Only) -->
        <aside class="sidebar-nav-desktop">
            <div class="sidebar-logo">
                <i class="fas fa-soap"></i>
                <span>Gloss<em>Flow</em></span>
            </div>
            <nav class="nav-links">
                <div class="nav-item active" data-tab="home">
                    <i class="fas fa-home"></i> <span>Home</span>
                </div>
                <div class="nav-item" data-tab="garage">
                    <i class="fas fa-car"></i> <span>Garage</span>
                </div>
                <div class="nav-item" data-tab="bookings">
                    <i class="fas fa-calendar-check"></i> <span>Bookings</span>
                </div>
                <div class="nav-item" data-tab="profile">
                    <i class="fas fa-user"></i> <span>Profile</span>
                </div>
            </nav>
        </aside>

        <!-- Main Viewport -->
        <div class="main-viewport">
            
            <!-- Unified Header -->
            <header class="dashboard-header">
                <div class="header-left">
                    <h2 id="page-title">Dashboard</h2>
                </div>
                <div class="header-right">
                    <button class="icon-btn"><i class="fas fa-bell"></i></button>
                    <div class="user-avatar">
                        <img src="https://ui-avatars.com/api/?name=Alex+Bryant&background=00FF94&color=000814" alt="User">
                    </div>
                </div>
            </header>

            <!-- Unified Content Area -->
            <main id="main-content" class="content-area">
                <div class="loader-container" style="display: flex; justify-content: center; align-items: center; height: 50vh;">
                    <div class="spinner" style="width: 40px; height: 40px; border: 4px solid rgba(0, 255, 148, 0.1); border-top-color: var(--neon-green); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                </div>
            </main>

            <!-- Bottom Navigation (Mobile Only) -->
            <div id="main-content-mobile"></div>
            <nav class="bottom-nav-mobile">
                <div class="nav-item active" data-tab="home">
                    <i class="fas fa-home"></i> <span>Home</span>
                </div>
                <div class="nav-item" data-tab="garage">
                    <i class="fas fa-car"></i> <span>Garage</span>
                </div>
                <div class="nav-item" data-tab="bookings">
                    <i class="fas fa-calendar-check"></i> <span>Book</span>
                </div>
                <div class="nav-item" data-tab="profile">
                    <i class="fas fa-user"></i> <span>Profile</span>
                </div>
            </nav>
        </div>

    <!-- Feedback Modal -->
    <div id="feedback-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(8px);">
        <div style="background: #0a0e17; width: 90%; max-width: 400px; padding: 30px; border-radius: 20px; border: 1px solid var(--neon-green); position: relative; text-align: center;">
            <h2 style="color: white; margin-bottom: 10px;">How was your wash?</h2>
            <p style="color: var(--text-dim); margin-bottom: 25px;">Your feedback helps us improve!</p>
            
            <input type="hidden" id="feedback-booking-id">
            
            <div id="star-rating" style="display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; font-size: 2rem; color: rgba(255,255,255,0.1);">
                <i class="fas fa-star" data-rating="1" style="cursor: pointer;"></i>
                <i class="fas fa-star" data-rating="2" style="cursor: pointer;"></i>
                <i class="fas fa-star" data-rating="3" style="cursor: pointer;"></i>
                <i class="fas fa-star" data-rating="4" style="cursor: pointer;"></i>
                <i class="fas fa-star" data-rating="5" style="cursor: pointer;"></i>
            </div>

            <textarea id="feedback-comment" placeholder="Leave a comment (optional)..." style="width: 100%; height: 100px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; color: white; resize: none; margin-bottom: 20px; outline: none;"></textarea>

            <div style="display: flex; gap: 15px;">
                <button onclick="closeFeedbackModal()" style="flex: 1; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); color: white; border: none; cursor: pointer;">Cancel</button>
                <button onclick="submitFeedback()" style="flex: 2; padding: 12px; border-radius: 12px; background: var(--neon-green); color: black; border: none; cursor: pointer; font-weight: bold;">Submit Review</button>
            </div>
        </div>
    </div>
    </div>

    <!-- Scripts -->
    <script src="../js/customer-logic/booking.js"></script>
    <script src="../js/customer-logic/tracking.js"></script>
    <script src="../js/customer-logic/garage-history.js"></script>
    <script src="../js/customer-logic/feedback.js"></script>
    <script src="../js/customer-logic/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Navigation) {
                window.Navigation.init();
            }
        });
    </script>
</body>

</html>
