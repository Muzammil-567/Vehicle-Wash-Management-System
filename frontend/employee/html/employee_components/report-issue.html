<div id="issue-modal-overlay" class="modal-overlay">
    <div class="issue-modal">
        <div class="modal-header">
            <h3><i class="fas fa-exclamation-triangle"></i> Report Site Issue</h3>
            <button class="close-modal" onclick="closeIssueModal()">&times;</button>
        </div>
        <form id="report-issue-form" class="issue-form" onsubmit="handleIssueSubmit(event)">
            <input type="hidden" id="report-task-id" value="">
            
            <div class="form-group">
                <label for="issue-type">Issue Type</label>
                <select id="issue-type" required>
                    <option value="" disabled selected>Select issue category...</option>
                    <option value="vehicle-damage">Vehicle Damage</option>
                    <option value="equipment-failure">Equipment Failure</option>
                    <option value="safety-hazard">Safety Hazard</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="issue-description">Description</label>
                <textarea id="issue-description" placeholder="Describe the problem in detail..." required></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeIssueModal()">Cancel</button>
                <button type="submit" class="btn-report">Submit Report</button>
            </div>
        </form>
    </div>
</div>
