<section class="profile-container animate-on-scroll">
    <!-- Profile Header (Centered) -->
    <div class="profile-header-card">
        <div class="profile-avatar-wrapper">
            <div class="avatar-ring"></div>
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=200" alt="Alex Rivera" class="profile-avatar">
            <div class="status-indicator-dot on-duty" style="position: absolute; bottom: 5px; right: 5px; width: 15px; height: 15px; border: 3px solid #000814;"></div>
        </div>
        <h2 class="profile-name">Alex Rivera</h2>
        <p class="profile-role">Cleaning Professional</p>
    </div>

    <!-- Card 1: Personal Details -->
    <div class="profile-glass-card-refined">
        <div class="card-header-refined">
            <i class="fas fa-id-card"></i>
            <span>Personal Details</span>
        </div>
        <div class="detail-rows-container">
            <div class="detail-row">
                <span class="label">Employee ID</span>
                <span class="value">EMP-8842</span>
            </div>
            <div class="detail-row">
                <span class="label">Email</span>
                <span class="value">alex.rivera@glossflow.app</span>
            </div>
            <div class="detail-row">
                <span class="label">Experience</span>
                <span class="value">2.5 Years</span>
            </div>
        </div>
    </div>

    <!-- Card 2: Work Preferences -->
    <div class="profile-glass-card-refined">
        <div class="card-header-refined">
            <i class="fas fa-sliders-h"></i>
            <span>Work Preferences</span>
        </div>
        <div class="preferences-container">
            <div class="preference-row">
                <div class="pref-text">
                    <h4>Dark Mode Navigation</h4>
                    <p>Optimized for night shifts</p>
                </div>
                <label class="duty-switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="preference-row">
                <div class="pref-text">
                    <h4>Silent Notifications</h4>
                    <p>Disable sounds while active</p>
                </div>
                <label class="duty-switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Session Management -->
    <div class="profile-actions-bottom">
        <button class="btn-logout-premium" onclick="alert('Logging out...')">
            <i class="fas fa-sign-out-alt"></i>
            <span>Log Out Session</span>
        </button>
    </div>
</section>
