<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join GlossFlow | Premium Car Wash</title>
    <link rel="stylesheet" href="/frontend/shared/css/global.css">
    <link rel="stylesheet" href="/frontend/auth/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-header">
            <a href="/frontend/website/index.html" class="logo">GLOSS<span>FLOW</span></a>
            <h1 class="text-glow">Join GlossFlow</h1>
            <p style="color: var(--text-dim);">Experience the pinnacle of car detailing.</p>
        </div>

        <div class="auth-toggle">
            <button class="toggle-btn active" id="login-toggle">Login</button>
            <button class="toggle-btn" id="signup-toggle">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" class="form-control" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary btn-auth">Enter Portal</button>
        </form>

        <!-- Signup Form (Hidden by default) -->
        <form id="signup-form" class="auth-form hidden">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signup-email" class="form-control" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="signup-phone" class="form-control" placeholder="+92 300 1234567" required>
            </div>
            <div class="form-group">
                <label>Create Password</label>
                <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary btn-auth">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>By joining, you agree to our <a href="#">Terms of Service</a></p>
        </div>
    </div>

    <script>
        const loginToggle = document.getElementById('login-toggle');
        const signupToggle = document.getElementById('signup-toggle');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');

        loginToggle.addEventListener('click', () => {
            loginToggle.classList.add('active');
            signupToggle.classList.remove('active');
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
        });

        signupToggle.addEventListener('click', () => {
            signupToggle.classList.add('active');
            loginToggle.classList.remove('active');
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // Login Logic
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userId', data.user.id);
                    localStorage.setItem('userRole', data.user.role);
                    localStorage.setItem('userName', data.user.full_name);
                    
                    const role = data.user.role || data.role;
                    if (role === 'admin') {
                        window.location.href = '/frontend/admin/html/index.html';
                    } else if (role === 'employee') {
                        window.location.href = '/frontend/employee/html/index.html';
                    } else if (role === 'customer') {
                        window.location.href = '/frontend/customer/html/index.html';
                    } else {
                        console.warn('Unknown role, redirecting to customer portal');
                        window.location.href = '/frontend/customer/html/index.html';
                    }
                } else {
                    alert(data.message || 'Invalid email or password');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('An error occurred during login. Please try again.');
            }
        });

        // Signup Logic
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const phone = document.getElementById('signup-phone').value;
            const password = document.getElementById('signup-password').value;

            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, email, password, phone })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    alert('Account Created!');
                    loginToggle.click(); // Switch to login view
                    signupForm.reset();
                } else {
                    alert(data.message || 'Registration failed');
                }
            } catch (error) {
                console.error('Signup error:', error);
                alert('An error occurred during registration. Please try again.');
            }
        });
    </script>
</body>

</html>
