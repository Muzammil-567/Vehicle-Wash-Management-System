<!-- Contact Us Section -->
<section class="contact-section" id="contact">
    <div class="container">
        <div class="contact-grid">
            <div class="contact-info animate-on-scroll">
                <h2>Connect With <span class="text-glow">GlossFlow</span></h2>
                <p>Have a question about our services or need a custom quote for your fleet? Reach out to our specialist team in Islamabad.</p>
                
                <div class="contact-details">
                    <div class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <div class="item-text">
                            <span>Email Us</span>
                            <p>concierge@glossflow.com</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-phone"></i>
                        <div class="item-text">
                            <span>Call Us</span>
                            <p>+92 51 1234567</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <div class="item-text">
                            <span>Visit HQ</span>
                            <p>Blue Area, Sector F-6, Islamabad</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="contact-form-container animate-on-scroll">
                <form id="contact-form" class="contact-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Service Interest</label>
                        <select id="service-type" class="form-control" required>
                            <option value="" disabled selected>Select Service Interest</option>
                            <option value="exterior">Exterior Wash</option>
                            <option value="interior">Interior Detailing</option>
                            <option value="ceramic">Ceramic Coating</option>
                            <option value="fleet">Fleet Management</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Your Message</label>
                        <textarea id="message" class="form-control" placeholder="How can we help you today?" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Send Message <i class="fas fa-paper-plane"></i></button>
                </form>
                <!-- Toast Notification Container -->
                <div id="toast-container"></div>
            </div>
        </div>
    </div>
</section>
