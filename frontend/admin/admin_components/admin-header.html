<!-- Dashboard Header -->
<header class="admin-header">
    <div class="header-left">
        <button class="menu-toggle" id="menu-toggle">
            <i class="fas fa-bars"></i>
        </button>
        <h2 id="page-title">Admin Dashboard</h2>
    </div>
    
    <div class="header-right">
        <div class="header-search" style="position: relative; display: none;">
            <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
            <input type="text" placeholder="Search data..." style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px 8px 40px; border-radius: 8px; color: white;">
        </div>
        
        <div class="admin-profile">
            <div class="profile-info" style="text-align: right; display: none;">
                <p style="font-size: 0.9rem; font-weight: 600;">Super Admin</p>
                <p style="font-size: 0.7rem; color: var(--text-dim);">System Architect</p>
            </div>
            <div class="profile-avatar">AD</div>
        </div>
    </div>
</header>
