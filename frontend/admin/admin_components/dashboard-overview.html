<!-- Dashboard Overview Section -->
<div class="content-view" id="dashboard-overview">
    <!-- Welcome Component -->
    <div class="welcome-banner" style="background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid rgba(0, 255, 148, 0.1); margin-bottom: 30px;">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Welcome back, <span class="text-glow">Admin</span></h1>
        <p style="color: var(--text-dim);">System Status: <span style="color: var(--accent-green);">ONLINE</span> | Active Bookings: 14</p>
    </div>

    <!-- Stats Overview Grid -->
    <div class="stats-overview">
        <!-- Card 1: Revenue -->
        <div class="stat-card">
            <i class="fas fa-dollar-sign stat-icon"></i>
            <span class="stat-label">Total Revenue</span>
            <span class="stat-value">RS. 125,000</span>
            <div class="stat-trend trend-up">
                <i class="fas fa-arrow-up"></i>
                <span>+12.5% vs last month</span>
            </div>
        </div>

        <!-- Card 2: Bookings -->
        <div class="stat-card">
            <i class="fas fa-calendar-check stat-icon"></i>
            <span class="stat-label">Active Bookings</span>
            <span class="stat-value">42</span>
            <div class="stat-trend trend-up">
                <i class="fas fa-arrow-up"></i>
                <span>+5.2% vs yesterday</span>
            </div>
        </div>

        <!-- Card 3: Customers -->
        <div class="stat-card">
            <i class="fas fa-users stat-icon"></i>
            <span class="stat-label">Total Customers</span>
            <span class="stat-value">1,204</span>
            <div class="stat-trend trend-up">
                <i class="fas fa-arrow-up"></i>
                <span>+24 new this week</span>
            </div>
        </div>

        <!-- Card 4: Performance -->
        <div class="stat-card">
            <i class="fas fa-chart-line stat-icon"></i>
            <span class="stat-label">Performance Rate</span>
            <span class="stat-value">98.5%</span>
            <div class="stat-trend trend-up">
                <i class="fas fa-check-circle"></i>
                <span>Peak efficiency</span>
            </div>
        </div>
    </div>
</div>
