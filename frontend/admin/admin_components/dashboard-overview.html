<!-- Dashboard Overview Section -->
<div class="content-view" id="dashboard-overview">
    <!-- Welcome Component -->
    <div class="welcome-banner" style="background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid rgba(0, 255, 148, 0.1); margin-bottom: 30px;">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Welcome back, <span class="text-glow">Admin</span></h1>
        <p style="color: var(--text-dim);">System Status: <span style="color: var(--accent-green);">ONLINE</span> | Active Bookings: 14</p>
    </div>

    <!-- Stats Overview Grid -->
    <div class="stats-overview">
        <!-- Card 1: Revenue -->
        <div class="stat-card">
            <i class="fas fa-dollar-sign stat-icon"></i>
            <span class="stat-label">Total Revenue</span>
            <span class="stat-value" id="stat-revenue">RS. 0</span>
            <button onclick="downloadFinancialReport()" style="margin-top: 10px; background: rgba(0, 255, 148, 0.1); color: var(--accent-green); border: 1px solid var(--accent-green); padding: 5px 10px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; font-weight: bold; width: 100%;">
                <i class="fas fa-file-download"></i> Download Full Report
            </button>
            <div class="stat-trend trend-up">
                <i class="fas fa-arrow-up"></i>
                <span>+12.5% vs last month</span>
            </div>
        </div>

        <!-- Card 2: Bookings -->
        <div class="stat-card">
            <i class="fas fa-calendar-check stat-icon"></i>
            <span class="stat-label">Active Bookings</span>
            <span class="stat-value" id="stat-bookings">0</span>
            <div class="stat-trend trend-up">
                <i class="fas fa-arrow-up"></i>
                <span>+5.2% vs yesterday</span>
            </div>
        </div>

        <!-- Card 3: Customers -->
        <div class="stat-card">
            <i class="fas fa-users stat-icon"></i>
            <span class="stat-label">Total Customers</span>
            <span class="stat-value" id="stat-customers">0</span>
            <div class="stat-trend trend-up">
                <i class="fas fa-arrow-up"></i>
                <span>+24 new this week</span>
            </div>
        </div>

        <!-- Card 4: Performance -->
        <div class="stat-card">
            <i class="fas fa-tasks stat-icon"></i>
            <span class="stat-label">Pending Tasks</span>
            <span class="stat-value" id="stat-pending">0</span>
            <div class="stat-trend trend-up">
                <i class="fas fa-check-circle"></i>
                <span>Peak efficiency</span>
            </div>
        </div>
    </div>

    <!-- Recent Bookings Table -->
    <div style="margin-top: 40px;">
        <h2 style="margin-bottom: 20px; font-size: 1.5rem;">Recent Bookings</h2>
        <div class="table-container" style="background: var(--card-bg); border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); overflow-x: auto;">
            <table class="data-table" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 255, 148, 0.05);">
                        <th style="padding: 15px; color: var(--accent-green);">ID</th>
                        <th style="padding: 15px; color: var(--accent-green);">Customer</th>
                        <th style="padding: 15px; color: var(--accent-green);">Vehicle</th>
                        <th style="padding: 15px; color: var(--accent-green);">Service</th>
                        <th style="padding: 15px; color: var(--accent-green);">Date/Time</th>
                        <th style="padding: 15px; color: var(--accent-green);">Status</th>
                        <th style="padding: 15px; color: var(--accent-green);">Action</th>
                    </tr>
                </thead>
                <tbody id="recent-bookings-list">
                    <tr><td colspan="7" style="padding: 15px; text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
