<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if(!localStorage.getItem('token') || localStorage.getItem('userRole') !== 'admin'){ 
            window.location.replace('/frontend/admin/html/loginportal.html'); 
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | GlossFlow</title>
    
    <!-- Core & Global Styles -->
    <link rel="stylesheet" href="../../shared/css/global.css">
    
    <!-- Modular Admin Styles -->
    <link rel="stylesheet" href="../css/admin-style.css"> <!-- Base Layout -->
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/calendar.css">
    <link rel="stylesheet" href="../css/analytics.css">
    <link rel="stylesheet" href="../css/settings.css">
    <link rel="stylesheet" href="../css/modals.css">
    <link rel="stylesheet" href="../css/stats-cards.css">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-wrapper">
        <!-- Sidebar Placeholder -->
        <div id="admin-sidebar-placeholder"></div>

        <!-- Main Content Shell -->
        <main class="admin-main">
            <!-- Header Placeholder -->
            <div id="admin-header-placeholder"></div>

            <!-- Dynamic Content Area -->
            <section class="dashboard-content" id="admin-content-placeholder">
                <!-- Sub-pages will be injected here -->
                <div class="loader-container" style="display: flex; justify-content: center; align-items: center; height: 50vh;">
                    <div class="spinner" style="width: 40px; height: 40px; border: 4px solid rgba(0, 255, 148, 0.1); border-top-color: var(--accent-green); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Placeholders -->
    <div id="admin-modal-placeholder"></div>
    <div id="add-user-modal-placeholder"></div>

    <!-- Logic Scripts -->
    <script src="../js/admin-utils.js"></script>
    <script src="../js/tab-switcher.js"></script>
    <script src="../js/modal-handler.js"></script>
    <script src="../js/user-handler.js"></script>
    <script src="../js/user-modal-handler.js"></script>
    <script src="../js/staff-handler.js"></script>
    <script src="../js/service-handler.js"></script>
    <script src="../js/booking-handler.js"></script>
    <script src="../js/revenue-handler.js"></script>
    <script src="../js/feedback-handler.js"></script>
    <script src="../js/settings-handler.js"></script>
    <script src="../js/admin-loader.js"></script>
    
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-container { font-family: 'Inter', sans-serif; color: var(--accent-green); }
    </style>
</body>
</html>
