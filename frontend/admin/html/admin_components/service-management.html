<!-- Service Management Section -->
<div class="content-view" id="service-management">
    <div class="action-bar">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" class="search-input" id="service-search" placeholder="Search services or packages...">
        </div>
        <button class="btn-add-user" id="add-service-btn">
            <i class="fas fa-plus"></i>
            <span>Add New Service/Package</span>
        </button>
    </div>

    <div class="service-card-grid" id="service-grid">
        <!-- Dynamic Content Injected by service-handler.js -->
        <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--accent-green);"></i>
            <p style="margin-top: 15px; color: var(--text-dim);">Fetching services from database...</p>
        </div>
    </div>
</div>
