<!-- Staff Management Section -->
<div class="content-view" id="staff-management">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1 style="font-size: 2rem;">Staff Management</h1>
        <button id="open-add-staff-modal" class="btn-primary" style="background: var(--accent-green); color: black; border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; cursor: pointer;">
            <i class="fas fa-plus"></i> Add New Staff
        </button>
    </div>

    <!-- Staff Stats -->
    <div class="stats-overview" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
        <div class="stat-card" style="background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">
            <span class="stat-label" style="color: var(--text-dim); font-size: 0.9rem;">Total Staff</span>
            <span class="stat-value" id="total-staff-count" style="display: block; font-size: 2rem; color: white; margin-top: 5px;">0</span>
        </div>
        <div class="stat-card" style="background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">
            <span class="stat-label" style="color: var(--text-dim); font-size: 0.9rem;">Active Now</span>
            <span class="stat-value" style="display: block; font-size: 2rem; color: var(--accent-green); margin-top: 5px;">All</span>
        </div>
    </div>

    <!-- Staff Table -->
    <div class="table-container" style="background: var(--card-bg); border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden;">
        <table class="data-table" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="border-bottom: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 255, 148, 0.05);">
                    <th style="padding: 15px; color: var(--accent-green);">ID</th>
                    <th style="padding: 15px; color: var(--accent-green);">Full Name</th>
                    <th style="padding: 15px; color: var(--accent-green);">Email Address</th>
                    <th style="padding: 15px; color: var(--accent-green);">Phone</th>
                    <th style="padding: 15px; color: var(--accent-green);">Join Date</th>
                    <th style="padding: 15px; color: var(--accent-green);">Action</th>
                </tr>
            </thead>
            <tbody id="staff-list-table">
                <tr><td colspan="6" style="padding: 20px; text-align: center; color: var(--text-dim);">Loading staff data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Staff Modal (Hidden by default via CSS in modals.css or style tag here) -->
<div id="add-staff-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: #111; width: 450px; padding: 30px; border-radius: 20px; border: 1px solid var(--accent-green); position: relative;">
        <h2 style="margin-bottom: 20px; color: var(--accent-green);">Add New Staff Member</h2>
        <form id="add-staff-form">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-dim);">Full Name</label>
                <input type="text" id="staff-name" required style="width: 100%; background: #222; border: 1px solid #333; padding: 12px; border-radius: 8px; color: white;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-dim);">Email Address</label>
                <input type="email" id="staff-email" required style="width: 100%; background: #222; border: 1px solid #333; padding: 12px; border-radius: 8px; color: white;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-dim);">Phone Number</label>
                <input type="text" id="staff-phone" required style="width: 100%; background: #222; border: 1px solid #333; padding: 12px; border-radius: 8px; color: white;">
            </div>
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-dim);">Initial Password</label>
                <input type="password" id="staff-password" required style="width: 100%; background: #222; border: 1px solid #333; padding: 12px; border-radius: 8px; color: white;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="button" id="close-staff-modal" style="flex: 1; padding: 12px; border-radius: 8px; background: #333; color: white; border: none; cursor: pointer;">Cancel</button>
                <button type="submit" style="flex: 2; padding: 12px; border-radius: 8px; background: var(--accent-green); color: black; border: none; cursor: pointer; font-weight: bold;">Create Account</button>
            </div>
        </form>
    </div>
</div>
