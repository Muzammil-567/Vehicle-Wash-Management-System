<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if(!localStorage.getItem('token') || localStorage.getItem('userRole') !== 'admin'){ 
            window.location.replace('/frontend/auth/login.html'); 
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | GlossFlow</title>
    
    <!-- Core & Global Styles -->
    <link rel="stylesheet" href="../css/global.css">
    
    <!-- Modular Admin Styles -->
    <link rel="stylesheet" href="../css/sections/admin-dashboard.css"> <!-- Base Layout -->
    <link rel="stylesheet" href="../css/sections/admin/sidebar.css">
    <link rel="stylesheet" href="../css/sections/admin/tables.css">
    <link rel="stylesheet" href="../css/sections/admin/calendar.css">
    <link rel="stylesheet" href="../css/sections/admin/analytics.css">
    <link rel="stylesheet" href="../css/sections/admin/settings.css">
    <link rel="stylesheet" href="../css/sections/admin/modals.css">
    <link rel="stylesheet" href="../css/sections/admin/stats-cards.css">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-wrapper">
        <!-- Sidebar Placeholder -->
        <div id="admin-sidebar-placeholder"></div>

        <!-- Main Content Shell -->
        <main class="admin-main">
            <!-- Header Placeholder -->
            <div id="admin-header-placeholder"></div>

            <!-- Dynamic Content Area -->
            <section class="dashboard-content" id="admin-content-placeholder">
                <!-- Sub-pages will be injected here -->
                <div class="loader-container" style="display: flex; justify-content: center; align-items: center; height: 50vh;">
                    <div class="spinner" style="width: 40px; height: 40px; border: 4px solid rgba(0, 255, 148, 0.1); border-top-color: var(--accent-green); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Placeholder -->
    <div id="admin-modal-placeholder"></div>

    <!-- Logic Scripts -->
    <script src="../js/admin-logic/tab-switcher.js"></script>
    <script src="../js/admin-logic/modal-handler.js"></script>
    <script src="../js/admin-logic/user-handler.js"></script>
    <script src="../js/admin-logic/service-handler.js"></script>
    <script src="../js/admin-logic/booking-handler.js"></script>
    <script src="../js/admin-logic/revenue-handler.js"></script>
    <script src="../js/admin-logic/feedback-handler.js"></script>
    <script src="../js/admin-logic/settings-handler.js"></script>
    <script src="../js/admin-logic/admin-loader.js"></script>
    
    <!-- Add User Modal -->
    <div class="modal-overlay" id="add-user-modal-overlay" style="display: none;">
        <div class="admin-modal">
            <div class="modal-header">
                <div style="display: flex; align-items: center;">
                    <i class="fas fa-user-plus neon-pulse-icon"></i>
                    <h2 id="user-modal-title">Create New Account</h2>
                </div>
                <button class="close-modal" id="close-user-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form class="admin-form" id="add-user-form">
                <div class="form-group">
                    <input type="text" id="user-full-name" required>
                    <label for="user-full-name">Full Name</label>
                </div>
                
                <div class="form-group">
                    <input type="email" id="user-email" required>
                    <label for="user-email">Email Address</label>
                </div>
                
                <div class="form-group">
                    <input type="text" id="user-phone">
                    <label for="user-phone">Phone Number (Optional)</label>
                </div>

                <div class="form-group">
                    <input type="password" id="user-password" required>
                    <label for="user-password">Password</label>
                </div>
                
                <div class="form-group">
                    <select id="user-role" required>
                        <option value="customer">Customer</option>
                        <option value="employee">Employee</option>
                    </select>
                    <label for="user-role" style="top: 0; font-size: 0.8rem;">Access Level / Role</label>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancel-user-modal">Discard</button>
                    <button type="submit" class="btn-save">Create User</button>
                </div>
            </form>
        </div>
    </div>
    
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-container { font-family: 'Inter', sans-serif; color: var(--accent-green); }
    </style>
</body>
</html>
